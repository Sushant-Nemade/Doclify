name: Verify Doclify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doclify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.13.0
      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Test
        run: uv run --frozen --extra dev pytest -q
      - name: Lint
        run: uv run --frozen --extra dev ruff check .
      - name: Check formatting
        run: uv run --frozen --extra dev ruff format --check .
      - name: Build source and wheel
        run: uv run --frozen --extra dev python -m build
      - name: Verify packaging and installed CLI
        run: uv run --frozen --extra dev python -m scripts.verify_release
      - name: Check distribution metadata
        run: uv run --frozen --extra dev python -m twine check dist/*
      - name: Audit installed dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run --frozen --extra dev pip-audit --local --skip-editable --progress-spinner off
      - name: Upload source and wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: doclify-portfolio-source-and-wheel
          path: dist/*
          retention-days: 14